name: Offline checks
on: [push, pull_request]
env:
  PYTHONUTF8: '1'
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install maibot-plugin-sdk==2.13.0 "httpx>=0.28,<1" "requests>=2.32,<3" "pillow>=11,<13" pytest ruff
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q -c pyproject.toml
      - run: python vendor/moss_skill/scripts/test_compile_prompt.py
      - run: python -m compileall -q -x "[.]git|[.]venv" .
      - run: git diff --check
