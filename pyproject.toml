[project]
name = "maibot-plugin-moss-image"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = ["maibot-plugin-sdk>=2.8.2,<2.14", "httpx>=0.28,<1", "requests>=2.32,<3", "pillow>=11,<13"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
