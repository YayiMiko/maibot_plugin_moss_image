# Copy to the plugin root as config.toml when configuring an installation.
[plugin]
config_version = "0.1.0"

[connection]
enabled = true
comfyui_base_url = "http://127.0.0.1:8188"
allowed_sender_ids = []
max_pending = 4
generation_timeout = 600
retention_days = 30
qq_cache_roots = []

[planning]
model_task = "utils"
model_name = ""
max_tokens = 4096
timeout = 180
danbooru_enabled = true
danbooru_budget = 8

[vision]
model_task = "vlm"
model_name = ""
max_tokens = 2048
timeout = 180

[styles]
positive_prefix = "best quality, highres,"
presets = ["千代风格=@yuasa akira, @tomose shunsaku, @kithera, @enuzoushigaya, 简洁干净的二次元平涂画风，"]
default_style = "千代风格"
default_application = "all" # generate: only generation; all: generation, comics and memes; draw excludes presets

[draw]
enabled = false
tavily_api_key = ""
use_profile = false
profile = "default"

[draw.limits]
prepare_timeout = 180
search_budget = 2
cache_mib = 256

[characters]
admin_user_ids = []

[rendering]
unet_name = "moss_image_sft_int8_convrot.safetensors"
clip_name = "qwen3.5_9b_int8_convrot.safetensors"
vae_name = "flux2-vae.safetensors"
aspect_ratio = "3:4"
megapixels = 1
max_megapixels = 2
steps = 50
cfg = 3
sampler = "euler"
scheduler = "sgm_uniform"
negative_prompt = "worst quality, bad anatomy, watermark, jpeg artifact"

[delivery]
timeout_seconds = 200
group_forward_threshold = 800
